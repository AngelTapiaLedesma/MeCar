version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestor_mecanico_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Mecanico_Admin123! # Cambia esto por una contraseña segura
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: